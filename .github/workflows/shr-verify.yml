name: Shiroe Verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate (Python ${{ matrix.python-version }})
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      # actions/checkout — pinned to v7.0.0 release SHA (Node 24)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        # actions/setup-python — pinned to v5.3.0 release SHA
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run shiroe-validate
        run: |
          python3 scripts/shiroe-validate.py

      - name: Verify SemVer tag format (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$'; then
            echo "Tag '$TAG' does not match SemVer pattern v<major>.<minor>.<patch>"
            exit 1
          fi
          echo "Tag '$TAG' OK"

      - name: Shiroe-scope sweep (no out-of-project bleed)
        run: |
          # List changed files vs origin/main; empty file if no diff.
          git diff origin/main..HEAD --name-only > /tmp/shiroe-scope.txt || true
          # If no diff, nothing to check.
          if [ ! -s /tmp/shiroe-scope.txt ]; then
            echo "Scope OK (no changed files vs origin/main)"
            exit 0
          fi
          # Allowed patterns: any changed file must match one of these anchored patterns.
          # Uses grep -E to avoid awk's regex-delimiter conflicts with `/` inside the pattern.
          # NOTE: this allowlist answers "is this path part of the project?", not
          # "does this file still exist?". A deleted file still appears in the
          # diff, so retiring a document requires keeping its entry here —
          # removing the entry makes the deletion itself fail the sweep.
          allowed='^(AGENTS\.md|CHANGELOG.*|CLAUDE\.md|CODEOWNERS|CONTRIBUTING\.md|GEMINI\.md|GITHUB_OS\.md|INSTALL\.md|LICENSE|MIGRATION\.md|PRIVACY\.md|README\.md|REDACT\.md|SECURITY\.md|SECURITY_CONTACTS\.md|SHARING_POLICY\.md|SKILL\.md|SOUL\.md|QUICKSTART\.md|TASKS\.md|CODEX\.md|LLAMA\.md|dashboard\.html|pyproject\.toml|pytest\.ini|zeref-registry\.json|shiroe-registry\.json|_shared/.*|agents/.*|assets/.*|benchmarks/.*|commands/.*|config/.*|docs/.*|memory/.*|missions/.*|policies/.*|references/.*|registry/.*|scripts/.*|skills/.*|team-packs/.*|team/.*|tests/.*|zeref/.*|shiroe/.*|\.claude-plugin/.*|\.cursor/.*|\.github/.*|\.gitignore|\.gitattributes|\.windsurfrules|\.aider\.conf\.yml.*)$'
          # unscoped = lines that DO NOT match the allowed pattern.
          unscoped=$(grep -Ev "$allowed" /tmp/shiroe-scope.txt || true)
          if [ -n "$unscoped" ]; then
            echo "Out-of-project files detected:"
            echo "$unscoped"
            exit 1
          fi
          echo "Scope OK"

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout — pinned to v7.0.0 release SHA (Node 24)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python — pinned to v5.3.0 release SHA
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Run version consistency checker
        run: |
          python3 scripts/check-version-consistency.py

  test:
    runs-on: ubuntu-latest
    name: pytest (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      # actions/checkout — pinned to v7.0.0 release SHA (Node 24)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python — pinned to v5.3.0 release SHA
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest coverage

      - name: Run pytest with coverage
        # H4.1 tiered coverage: measure once, then gate global and
        # governance-critical packages separately. Subprocess-driven CLI
        # tests still under-count cli.py / lock.py paths, which is why
        # the global floor is 70% (measured baseline ~72-75%) rather
        # than 80%. Governance-critical packages (policy, execution,
        # work, storage, capabilities, memory) currently sit above the
        # handoff targets (line >=90%, branch >=80%).
        run: |
          coverage run --source=shiroe --branch -m pytest -q
          coverage report -m --fail-under=70
          coverage xml -o coverage.xml
          coverage html -d htmlcov

      - name: Governance-critical coverage gate (>=89%; target 90%)
        # Measured combined (line+branch) coverage on the hardened tree
        # sits at ~89.3%. The gate ratchets from measured baseline; the
        # handoff target is 90% and gets tightened as targeted tests
        # close the remaining gap. Do NOT drop this below 89.
        run: |
          coverage report \
            --include='shiroe/policy/*,shiroe/execution/*,shiroe/work/*,shiroe/storage/*,shiroe/capabilities/*,shiroe/memory/*' \
            --fail-under=89

      - name: Governance-critical branch coverage report
        # Coverage.py cannot fail-under-branch directly, so print the
        # combined line+branch percentage for the same include set and
        # rely on the review script's threshold check.
        run: |
          coverage report \
            --include='shiroe/policy/*,shiroe/execution/*,shiroe/work/*,shiroe/storage/*,shiroe/capabilities/*,shiroe/memory/*' \
            --precision=1

      - name: Upload coverage report
        # actions/upload-artifact — pinned to v4.4.3 release SHA
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  privacy:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout — pinned to v7.0.0 release SHA (Node 24)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python — pinned to v5.3.0 release SHA
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install package (editable)
        run: |
          python3 -m pip install --upgrade pip
          pip install -e .

      - name: Scan repo for committed secrets
        run: |
          # any provider-shaped credential pattern anywhere in the repo
          set -e
          if grep -rnE 'sk-proj-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xoxb-[A-Za-z0-9-]{10,}|AIza[A-Za-z0-9_\-]{30,}|AKIA[A-Z0-9]{16}' \
              --exclude-dir=.git \
              --exclude-dir=tests \
              --exclude-dir=docs \
              --exclude=privacy.py \
              --exclude=test_*.py \
              .; then
            echo "Committed credential-shaped string detected"
            exit 1
          fi
          echo "No committed credentials detected"

  e2e:
    runs-on: ubuntu-latest
    name: Clean-clone install + init/doctor
    steps:
      # actions/checkout — pinned to v7.0.0 release SHA (Node 24)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python — pinned to v5.3.0 release SHA
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install package into a clean venv
        run: |
          python3 -m venv /tmp/shr-e2e-venv
          /tmp/shr-e2e-venv/bin/python3 -m pip install --upgrade pip
          /tmp/shr-e2e-venv/bin/pip install "${GITHUB_WORKSPACE}"

      - name: shiroe init + shiroe doctor + state verify in a scratch project
        run: |
          set -e
          mkdir -p /tmp/shr-e2e-project
          cd /tmp/shr-e2e-project
          /tmp/shr-e2e-venv/bin/shiroe init --name e2e-check --privacy local-only --tier standard
          /tmp/shr-e2e-venv/bin/shiroe doctor --json
          /tmp/shr-e2e-venv/bin/shiroe verify --memory --json
          /tmp/shr-e2e-venv/bin/shiroe state verify --json

  release-readiness:
    runs-on: ubuntu-latest
    name: vNext release-readiness gate
    steps:
      # actions/checkout — pinned to v7.0.0 release SHA (Node 24)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        # actions/setup-python — pinned to v5.3.0 release SHA
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install package (editable) + pytest
        run: |
          python3 -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run scripts/release_ready.py (CI mode skips pytest re-run)
        env:
          # The `test` job already runs pytest across three Python
          # versions; skip the repeat here so this job only exercises
          # the non-pytest gates (validate, canon, active-identity,
          # version-consistency, trust-registry, doctor, verify,
          # state-verify, dead-surface-scanner).
          SHIROE_RELEASE_READY_SKIP: "pytest-full,invariant-suite"
        run: |
          python3 scripts/release_ready.py

  doc-freshness:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout — pinned to v7.0.0 release SHA (Node 24)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        # actions/setup-python — pinned to v5.3.0 release SHA
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest

      - name: Run doc freshness guard
        run: |
          python3 -m pytest -q tests/test_doc_freshness.py
