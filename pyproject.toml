# privacy-audit: allow-file "Package metadata. Author name + description + keywords are public-package metadata by design, not user data."
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiroe"
version = "3.0.0-alpha.1"
description = "Local-first AI work control plane for governed execution, model routing, project memory, evidence, and handoffs. Harness-agnostic, model-agnostic, privacy-first."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ai", "memory", "context", "llm", "agent", "shiroe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# Core: stdlib only — zero mandatory deps
dependencies = []

[project.optional-dependencies]
llm       = ["litellm>=1.0"]    # LLM-enhanced routing
duckdb    = ["duckdb>=0.10"]    # Parquet snapshot export
yaml      = ["pyyaml>=6.0"]     # richer REDACT.md YAML parsing
tokenizer = ["tiktoken>=0.5"]   # cost_router token estimate (model-family tokenizer)
all       = ["litellm>=1.0", "duckdb>=0.10", "pyyaml>=6.0", "tiktoken>=0.5"]

[project.scripts]
shiroe = "shiroe.cli:main"

[project.urls]
Homepage  = "https://github.com/kanadhiayash/shiroe"
Changelog = "https://github.com/kanadhiayash/shiroe/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where   = ["."]
include = ["shiroe*"]

[tool.setuptools.package-data]
shiroe = ["VERSION", "IDENTITY.json", "adapters/*.json", "adapters/providers/*.json"]
